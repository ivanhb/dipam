
<!--CSS-->

<!--START:HTML-->
<div id="control_body" data-type="tool" data-id="{id}" data-class="{unit_class}" class="tool-unit">

      <div id="control_mid row">

          <div class="dipam-unit-template col">

            <!-- To enable the edit of the element -->
              <div class="row">
                  <div class="btn-edit col">
                    <span><button id="edit_btn" class="btn btn-primary">Edit</button></span>
                    <span><button id="cancel_btn" class="btn btn-default">Cancel</button></span>
                    <span><button id="remove_btn" class="btn btn-danger">Delete item</button></span>
                  </div>
              </div>

              <div id="node_data">

                  <!--START:INPUTS-->
                  <div id="input_section">

                      <h1><input class="input-metadata" value="{label}" type="text" data-dipam-value="label"></h1>
                      <p><input class="input-metadata" value="{description}" type="text" data-dipam-value="description"></p>

                      <div id="input_group">
                          <!--HTML-->
                      </div>
                  </div>
                  <!--END:INPUTS-->

              </div>


          </div>

      </div>
      <div id="control_foot"></div>

</div>
<!--END:HTML-->

<!--JS-->
