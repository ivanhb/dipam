<!--
To init a DIPAM tool unit template you need to define these components (in order):

[OPTIONAL] (1) CSS - CSS code
    Define it inside the "CSS" block.
[MANDATORY] (2) HTML-TEMPLATE - the actual HTML template of the unit
    Define it inside the "HTML-TEMPLATE" block.
[OPTIONAL] (3) VIEW-VALUE – define the view settings;
    Define it inside the "VIEW-VALUE" block.
[OPTIONAL] (4) EVENT-TRIGGER - define events
    Define it inside the "EVENT-TRIGGER" block.
-->

<!--START:HTML-TEMPLATE-->
<p>This is an HTML element mapped to a dipam unit view value (input_freetxt)</p>
<input placeholder="Set a string value ..." type="text" data-dipam-value="input_freetxt"></input>
<p>This is another HTML element mapped to a dipam unit view value (div_freetext)</p>
<div data-dipam-value="div_freetext"></div>
<!--HTML-TEMPLATE:END-->
