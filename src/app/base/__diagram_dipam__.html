
<!--START:HTML-->
<div id="control_body" data-type="diagram" data-id="{id}" data-class="DIAGRAM_DIPAM_UNIT" class="diagram-unit">

      <div id="control_mid row">
          <div class="dipam-unit-template col">

            <div class="row">
                <div class="btn-edit col">
                  <span><button id="edit_btn" class="btn btn-primary">Edit</button></span>
                  <span><button id="cancel_btn" class="btn btn-default">Cancel</button></span>
                </div>
            </div>

            <div id="node_data">
                <div id="input_section">
                    <h1><input value="{label}" type="text" data-dipam-value="label"></input></h1>
                    <br>
                    <p>
                      <textarea rows="10" cols="30" value="{description}" type="text" data-dipam-value="description"></textarea>
                    </p>
                </div>
            </div>

          </div>
      </div>
      <div id="control_foot"></div>
</div>
<!--END:HTML-->
